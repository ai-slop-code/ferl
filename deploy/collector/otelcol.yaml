receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256

exporters:
  file/ferl:
    path: /capture/telemetry.json
    format: json
    rotation:
      max_megabytes: 8
      max_days: 1
      max_backups: 2

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/ferl]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/ferl]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/ferl]
