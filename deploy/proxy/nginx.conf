# Shared-origin ferl routing example (NGINX 1.27.5, tested on Podman).
# scripts/proxy.sh substitutes the backend address for local verification.
upstream ferl_backend {
    server ferl-backend:8080;
    keepalive 16;
}

log_format ferl_safe '$remote_addr $request_method $status';

server {
    listen 8080;
    server_name _;

    # Stream bodies to ferl so its fixed 65,536-byte reader returns the
    # contract's structured 413 rather than an NGINX-generated HTML response.
    client_max_body_size 0;
    proxy_request_buffering off;

    # One request-target buffer can hold the maximum 87,387-byte sealed cursor
    # plus route/query syntax. Four buffers also bound aggregate header parsing.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 128k;
    client_header_timeout 10s;
    client_body_timeout 15s;

    access_log /dev/stdout ferl_safe;
    error_log /dev/stderr crit;

    # The static fixture is intentionally separate from ferl. No SPA history
    # fallback is configured; missing files remain 404.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # API paths win before generic one-segment short-code lookup.
    location = /api {
        proxy_pass http://ferl_backend;
        include /etc/nginx/ferl-proxy-headers.conf;
    }

    location ^~ /api/ {
        proxy_pass http://ferl_backend;
        include /etc/nginx/ferl-proxy-headers.conf;
    }

    # /assets, /health, /api-sale, and all other nonreserved paths are passed
    # through unchanged; ferl itself rejects multi-segment/unknown paths.
    location / {
        proxy_pass http://ferl_backend;
        include /etc/nginx/ferl-proxy-headers.conf;
    }
}
