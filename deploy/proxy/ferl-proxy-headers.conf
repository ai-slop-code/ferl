proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# This example is the edge proxy. Replace client-supplied forwarding data with
# the TCP peer NGINX actually observed. If another trusted load balancer is in
# front, that edge must sanitize/append its own chain and the ferl trust list
# must include only the observed proxy hops.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 3s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_intercept_errors off;
proxy_redirect off;
