[package]
name = "ferl-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
build = "build.rs"
publish = false

[lib]
name = "ferl_server"
path = "src/lib.rs"

[[bin]]
name = "ferl-server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
http = "1.3.1"
ipnet = "2.11.0"
opentelemetry = { version = "0.33.1", features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-client", "reqwest-rustls", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace", "metrics", "logs", "rt-tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
thiserror = "2.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["limit", "util"] }
tracing = "0.1"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
